
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
cds:
  data-source.auto-config.enabled: false
  security:
    xsuaa:
      enabled: true
---
spring:
  config.activate.on-profile: cloud
cds:
  index-page.enabled: true
    
  sql.hana.search:
    fuzzy: true
    fuzzinessThreshold: 0.9
---
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
